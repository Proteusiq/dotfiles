# ------------------------------------------------------------------------------
# PLUGINS (tpm runs after the options below and before the key bindings)
# ------------------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'                  # plugin manager
set -g @plugin 'tmux-plugins/tmux-resurrect'       # restore sessions after system restart
set -g @plugin 'tmux-plugins/tmux-continuum'       # save sessions automatically
set -g @plugin 'christoomey/vim-tmux-navigator'    # pane navigation shared with Neovim
set -g @plugin 'tmux-plugins/tmux-yank'            # clipboard support
set -g @plugin 'tmux-plugins/tmux-sensible'        # basic tmux settings
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'cesarferreira/tmux.expose'         # Mission Control-style session switcher (Alt+e)

# Plugin options
set -g @catppuccin_flavour 'mocha'
set -g @continuum-restore 'on'                     # restore the last saved session on start
set -g @continuum-save-interval '5'                # minutes between saves
set -g @resurrect-dir '~/.tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-strategy-vim 'session'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'
set -g @scroll-speed-num-lines-per-scroll 1
set -g @scroll-without-changing-pane on

# ------------------------------------------------------------------------------
# SETTINGS
# ------------------------------------------------------------------------------

set -g default-shell "${SHELL}"
set -g default-terminal "tmux-256color"
set -ga terminal-features ',*:RGB'
set -ga terminal-features ',*:clipboard'
set -sg escape-time 0                              # no delay after Esc (Neovim)
set -g focus-events on
set -g extended-keys on
set -g extended-keys-format csi-u

# Start windows and panes at 1, not 0; renumber when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g mouse on
set -g history-limit 50000
set -g detach-on-destroy on
set -g allow-rename off
set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'

# Activity notifications
set -g display-time 2500
set -wg monitor-activity on
set -wg monitor-bell on

# Image previews in yazi and passthrough for Ghostty features
# https://yazi-rs.github.io/docs/image-preview#tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Status bar
set -g status-position bottom
set -g status-style fg=default,bg=default
setw -g window-status-current-style fg=cyan,bold
setw -g window-status-style fg=default,bg=default

# ------------------------------------------------------------------------------
# Initialise tpm after all options, so plugins see them, and before the key
# bindings, so these bindings win over plugin defaults (e.g. resurrect's C-s).
# ------------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'

# ------------------------------------------------------------------------------
# KEY BINDINGS (prefix is the default C-b)
# ------------------------------------------------------------------------------

# vi copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind P paste-buffer

# New windows and splits open in the current directory
bind c new-window -c "#{pane_current_path}"
bind i split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Swap windows
bind-key -r < swap-window -t -1
bind-key -r > swap-window -t +1

# Resize panes with prefix + h/j/k/l (move between panes with C-h/j/k/l)
bind-key -r h resize-pane -L 10
bind-key -r j resize-pane -D 10
bind-key -r k resize-pane -U 10
bind-key -r l resize-pane -R 10

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key x kill-pane                               # no "kill-pane? (y/n)" prompt
bind-key C-s set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Popups: lazygit (g), lazydocker (D), sesh pickers (K with gum, T with fzf)
bind g run 'tmux popup -EE -h 100% -w 100% "lazygit -p "#{pane_current_path}""'
bind D run 'tmux popup -EE -h 100% -w 100% lazydocker'
bind K display-popup -E -w 40% "sesh connect \"$(
	sesh list -i | gum filter --limit 1 --placeholder 'Pick a sesh' --height 50 --prompt='⚡'
)\""
bind-key "T" run-shell "sesh connect \"$(
	sesh list | fzf-tmux -p 55%,60% \
		--no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
		--header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
		--bind 'tab:down,btab:up' \
		--bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
		--bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
		--bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c)' \
		--bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
		--bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
		--bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""
