[mgr]
linemode = "size"
show_hidden = true
sort_by = "natural"

[preview]
tab_size = 2
max_width = 1000
max_height = 1000

[opener]
edit = [{ run = '${EDITOR:-nvim} "$@"', desc = "$EDITOR", block = true }]
play = [{ run = 'open "$@"', desc = "Open with default app", orphan = true }]

[open]
prepend_rules = [
    { url = "*/", use = ["edit", "reveal"] },
    { mime = "text/*", use = ["edit", "reveal"] },
    { mime = "inode/x-empty", use = ["edit", "reveal"] },
    { mime = "application/json", use = ["edit", "reveal"] },
    { mime = "*/javascript", use = ["edit", "reveal"] },
    { mime = "{audio,video}/*", use = ["play", "reveal"] },
]
